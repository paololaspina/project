name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: HTML-Tests
  # ==========================================
  test:
    name: HTML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Tests ausführen
        run: bash ./test.sh

  # ==========================================
  # JOB 2: Docker-Build
  # ==========================================
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Docker-Image bauen
        run: docker build -t cicd-webserver:${{ github.sha }} .

      - name: Docker-Image überprüfen
        run: docker image inspect cicd-webserver:${{ github.sha }}

  # ==========================================
  # JOB 3: Docker-Image nach Amazon ECR
  # ==========================================
  push_ecr:
    name: Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: AWS-Anmeldung über OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::468677424228:role/GitHubActions-CICD-Role
          aws-region: us-east-1

      - name: Bei Amazon ECR anmelden
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker-Image bauen und hochladen
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cicd-webserver
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
